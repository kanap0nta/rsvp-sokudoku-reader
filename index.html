<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP 速読リーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efede8; --panel:#ffffff; --ink:#1c1a17; --sub:#6d6860; --line:#d6d2c9;
  --accent:#a8232a; --accent-ink:#ffffff; --mark:#f1e2a2; --track:#d9d4ca;
  --n0:#8a6a00; --n1:#b3202a; --n2:#2d5b99; --n3:#2c7449; --n4:#74399a; --n5:#9a4f17;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --panel:#252321; --ink:#ebe6dc; --sub:#9d978c; --line:#3a3733;
    --accent:#d0474e; --accent-ink:#fff; --mark:#5b4c17; --track:#3b3834;
    --n0:#e0b93c; --n1:#f06a70; --n2:#7fa9ea; --n3:#6cc592; --n4:#c592ec; --n5:#e39a5c;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a18; --panel:#252321; --ink:#ebe6dc; --sub:#9d978c; --line:#3a3733;
  --accent:#d0474e; --accent-ink:#fff; --mark:#5b4c17; --track:#3b3834;
  --n0:#e0b93c; --n1:#f06a70; --n2:#7fa9ea; --n3:#6cc592; --n4:#c592ec; --n5:#e39a5c;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);min-height:44px;flex-wrap:wrap}
.ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.auth{color:var(--sub);white-space:nowrap}
#chSel{max-width:220px}
.spacer{flex:1}
.keys{color:var(--sub);font-size:12.5px;white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer}
.ghost:hover{border-color:var(--sub)}
.ghost:disabled{opacity:.45;cursor:default}
#sMode{min-width:100px}
#reader{position:absolute;inset:0;display:none;flex-direction:column}
.normal #reader{display:flex}
.normal #stage,.normal .tick,.normal #hint,.normal #preview{display:none!important}
.normal #ctrl .row:first-child>:not(#btnReset):not(.readerControl),.normal #ctrl .row.two>:not(.readerColor){display:none}
#ctrl .readerControl{display:none}
.normal #ctrl .readerControl{display:flex}
#readerScroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-behavior:auto;padding:28px 24px 40px}
#readerBody{max-width:42em;margin:auto;font-family:var(--mincho);font-size:20px;line-height:2.2;overflow-wrap:anywhere}
#readerBody p{margin:0 0 1.2em;white-space:pre-wrap}
#readerBody p.h{font-weight:700;margin:0 0 1.5em;letter-spacing:.15em}
#readerBody rt{font-size:.5em;color:var(--sub)}
#readerBody .c{cursor:pointer;border-radius:3px}
#readerBody .c:hover{background:color-mix(in srgb,var(--mark) 55%,transparent)}
#readerBody .cur{background:var(--mark)}
#readerBody figure{margin:1.5em 0;text-align:center}
#readerBody figure img{display:block;max-width:100%;height:auto;margin:auto;background:#fff}
#readerBody figure.cur{outline:2px solid var(--accent);outline-offset:4px;background:transparent}
#readerBody figcaption{font-family:var(--sans);font-size:.7em;line-height:1.7;color:var(--sub);margin-top:.6em}
#readerBody.pdfBook{max-width:none;overflow-wrap:normal;line-height:normal}
.pdfPage{position:relative;margin:0 auto 24px;background:#fff;box-shadow:0 1px 5px #0002}
.pdfPage iframe{display:block;border:0;width:100%;height:100%;background:#fff}
.pdfPage.cur{outline:2px solid var(--accent);outline-offset:3px;background:#fff!important}
.pdfPageLabel{position:absolute;inset:0;display:grid;place-items:center;color:#666;font:14px var(--sans);pointer-events:none}
.pdfPage.loaded .pdfPageLabel{display:none}
#readerFooter{position:relative;flex-shrink:0}
.footerSwitch{display:none;position:absolute;right:18px;bottom:100%;z-index:2}
.normal .footerSwitch{display:block}
.normal.footerCollapsed #footerPanel{display:none}
#btnFooter{height:24px;min-width:56px;padding:3px 9px;font-size:11px;border-radius:7px 7px 0 0;border-bottom:0;background:var(--panel);box-shadow:0 -1px 3px #0001}

#stageWrap{flex:1;position:relative;min-height:140px;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
#word{font-family:var(--mincho);font-weight:500;line-height:1.15;white-space:nowrap;padding:.62em 0 .62em;letter-spacing:.02em}
#word ruby{ruby-position:over}
#word rt{font-size:.36em;letter-spacing:.08em;font-weight:500}
.vert #word{writing-mode:vertical-rl;padding:0 .62em}
.nm{position:relative;font-weight:700}
.lbl{position:absolute;top:calc(100% + .1em);left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:.26em;font-weight:700;white-space:nowrap;letter-spacing:.04em}
.vert .lbl{top:50%;left:auto;right:calc(100% + .15em);transform:translateY(-50%);writing-mode:vertical-rl}
.head #word{color:var(--sub);letter-spacing:.3em}
.tick{position:absolute;background:var(--accent);opacity:.65;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--sub);font-size:12.5px;pointer-events:none}

#preview{margin:0 18px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:34vh;overflow:auto;padding:14px 20px 18px;font-family:var(--mincho);font-size:16px;line-height:2.05;display:none}
.paused #preview{display:block}
.fin #preview{display:none}
#legend{font-family:var(--sans);font-size:12.5px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:4px 16px}
#legend:empty{display:none}
#legend b{font-family:var(--mincho);font-size:14px;margin-right:4px}
#legend span{color:var(--sub)}
#preview p{margin:0 0 .5em}
#preview p.h{font-weight:700;letter-spacing:.2em}
#preview .c{cursor:pointer;border-radius:3px}
#preview .c:hover{background:color-mix(in srgb,var(--mark) 55%,transparent)}
#preview .c.cur{background:var(--mark)}
#preview rt{font-size:.5em;color:var(--sub)}
#preview .nm{font-weight:700}
.gap{color:var(--sub);font-family:var(--sans);font-size:12px}

#bar{height:4px;margin:0 18px;background:var(--track);border-radius:2px;position:relative;cursor:pointer}
#bar::before{content:"";position:absolute;inset:-8px 0}
#fill{height:100%;width:0;background:var(--accent);border-radius:2px}
#meta{display:flex;justify-content:space-between;padding:6px 18px 0;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums;gap:12px}

#ctrl{padding:10px 18px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.row.two{justify-content:center}
.grp{display:flex;align-items:center;gap:8px;white-space:nowrap}
.grp>span:first-child{color:var(--sub)}
.val{font-variant-numeric:tabular-nums;min-width:5.6em}
.val.px{min-width:3.2em}
#btnReset{width:44px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:grid;place-items:center}
#btnPlay{height:38px;min-width:110px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:108px}
input[type=range]{accent-color:var(--accent);width:150px}
label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* 読了画面 */
#done{position:absolute;inset:0;background:var(--bg);display:none;overflow:auto;padding:28px 18px}
#done.on{display:block}
.doneIn{max-width:560px;margin:auto;text-align:center;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.doneIn h2{margin:0;font-size:26px;letter-spacing:.02em}
.stat{font-size:16px;font-variant-numeric:tabular-nums}
.rest{color:var(--sub);margin-top:6px}
#restT{font-size:52px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1;font-weight:300}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 18px;cursor:pointer;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
table{border-collapse:collapse;margin:10px auto 0;font-variant-numeric:tabular-nums;font-size:14px}
td{padding:6px 14px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child{text-align:left}
tr.tot td{font-weight:700;border-bottom:1px solid var(--sub)}
.fin{color:var(--sub);margin-top:6px}

/* 読み込みダイアログ */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{display:flex;flex-direction:column;gap:12px;padding:20px 22px;max-height:92vh;overflow:auto}
.dlg h3{margin:0;font-size:17px}
.dlg p{margin:0;color:var(--sub);font-size:13px;line-height:1.7}
.dlg textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;resize:vertical;line-height:1.7}
#inText{min-height:200px;font-family:var(--mincho)}
#inChars{min-height:78px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2 input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub)}
.dlgF{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#inInfo{color:var(--sub);font-size:13px;flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:760px){
  header{padding:8px 12px;gap:8px}
  .keys{display:none}
  #preview{margin:0 10px 8px;padding:10px 14px;font-size:15px}
  #bar{margin:0 12px} #meta{padding:6px 12px 0}
  .footerSwitch{right:12px}
  #ctrl{padding:8px 12px 12px}
  .row{gap:8px 12px}
  input[type=range]{width:110px}
  #btnPlay{min-width:92px}
  .f2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app" class="paused">
  <header>
    <span class="ttl" id="hTitle"></span><span class="auth" id="hAuth"></span>
    <select id="chSel" aria-label="章を選ぶ" hidden></select>
    <span class="spacer"></span>
    <select id="sMode" aria-label="読書モード"><option value="rsvp">速読</option><option value="normal">通常</option></select>
    <span class="keys" id="keys">Space 再生/停止 · ←→ 1文節 · Shift+←→ 段落 · ↑↓ 速度 · V 縦横</span>
    <button class="ghost" id="btnOpen">テキストを開く</button>
  </header>

  <div id="stageWrap">
    <section id="reader" aria-label="通常リーダー">
      <div id="readerScroll" tabindex="0" aria-label="本文"><article id="readerBody"></article></div>
    </section>
    <div id="stage" role="button" aria-label="再生・停止">
      <div id="word"></div>
    </div>
    <div class="tick" id="t1"></div><div class="tick" id="t2"></div>
    <div class="hint" id="hint">画面をタップ、または Space で再生</div>
    <div id="done" aria-live="polite"><div class="doneIn" id="doneIn"></div></div>
  </div>

  <div id="preview"><div id="legend"></div><div id="pvBody"></div></div>

  <footer id="readerFooter">
  <div id="bar" title="クリックで移動"><div id="fill"></div></div>
  <div id="footerPanel">
  <div id="meta"><span id="mPos"></span><span id="mAll"></span><span id="mRest"></span></div>

  <div id="ctrl">
    <div class="row">
      <button id="btnReset" title="章の先頭へ" aria-label="章の先頭へ"><svg width="14" height="12" viewBox="0 0 14 12"><rect x="0" y="0" width="2" height="12" fill="currentColor"/><path d="M8 0v12L2 6z M14 0v12L8 6z" fill="currentColor"/></svg></button>
      <label class="grp readerControl"><span>文字</span><input type="range" id="sReaderSize" min="14" max="36" step="1"><span class="val px" id="vReaderSize"></span></label>
      <button class="ghost readerControl" id="readerNext">次の章へ</button>
      <button id="btnPlay"><span id="pIco">▶</span><span id="pTxt">再生</span></button>
      <div class="grp"><span>速度</span><input type="range" id="sCpm" min="300" max="3000" step="50"><span class="val" id="vCpm"></span></div>
      <div class="grp"><span>まとめる</span><select id="sGroup">
        <option value="1">1文節ずつ</option><option value="2">2文節ずつ</option><option value="3">3文節ずつ</option><option value="0">句読点まで</option></select></div>
      <div class="grp"><span>最小</span><select id="sMin">
        <option value="1">制限なし</option><option value="2">2字以上</option><option value="3">3字以上</option><option value="4">4字以上</option><option value="5">5字以上</option></select></div>
      <div class="grp"><span>文字</span><input type="range" id="sSize" min="28" max="120" step="2"><span class="val px" id="vSize"></span></div>
      <label class="chk"><input type="checkbox" id="sPunct">句読点で間をとる</label>
    </div>
    <div class="row two">
      <label class="chk readerColor"><input type="checkbox" id="sColor">名前を色分け</label>
      <div class="grp"><span>人物ラベル</span><select id="sLabel">
        <option value="0">表示しない</option><option value="1">章の最初1回</option><option value="3">章の最初3回</option><option value="999">毎回</option></select></div>
      <label class="chk"><input type="checkbox" id="sSlow">名前で少し長く</label>
      <label class="chk"><input type="checkbox" id="sVert">縦表示</label>
      <label class="chk"><input type="checkbox" id="sGuide">注視点ガイド</label>
    </div>
  </div>
  </div>
  <div class="footerSwitch"><button class="ghost" id="btnFooter" aria-expanded="false" aria-controls="footerPanel" aria-label="操作パネルを開く" title="操作パネルを開く">▴ 操作パネル</button></div>
  </footer>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="dlgForm">
    <h3>テキストを開く</h3>
    <p>貼り付けるか、.txt / .epub ファイルを選んでください（画面へのドラッグ＆ドロップも可）。EPUB は目次に沿って章に分け、ルビも取り込みます。DRM 付きの EPUB は読めません。青空文庫のテキスト（Shift_JIS 可）は注記・ルビ《》・見出しをそのまま解釈します。「第一章」「# 見出し」の行、青空文庫の大・中見出しで章に分かれます。</p>
    <div class="dlgF"><input type="file" id="inFile" accept=".txt,.epub,text/plain,application/epub+zip"><span id="inInfo"></span></div>
    <textarea id="inText" placeholder="ここに本文を貼り付け"></textarea>
    <div class="f2">
      <label class="fl">タイトル<input id="inTitle"></label>
      <label class="fl">著者<input id="inAuthor"></label>
    </div>
    <label class="fl">登場人物（1行に「名前 ラベル」。空白区切り、ラベルは省略可）<textarea id="inChars" placeholder="御釈迦様 極楽の主&#10;犍陀多 地獄の大泥坊"></textarea></label>
    <label class="chk" style="font-size:13px"><input type="checkbox" id="inParen" checked>「漢字（かな）」をルビとして扱う（青空文庫のWebページからコピーした場合）</label>
    <div class="dlgF">
      <button type="button" class="btn" id="inSample">サンプル（蜘蛛の糸）</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="inCancel">キャンセル</button>
      <button type="button" class="btn pri" id="inLoad">読み込む</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
"use strict";
/* ============ サンプル本文（芥川龍之介「蜘蛛の糸」青空文庫・パブリックドメイン） ============ */
const SAMPLE = {
title:"蜘蛛の糸", author:"芥川龍之介",
chars:"御釈迦様 極楽の主\n犍陀多 地獄の大泥坊",
text:`一
ある日の事でございます。御釈迦様《おしゃかさま》は極楽の蓮池《はすいけ》のふちを、独りでぶらぶら御歩きになっていらっしゃいました。池の中に咲いている蓮《はす》の花は、みんな玉のようにまっ白で、そのまん中にある金色《きんいろ》の蕊《ずい》からは、何とも云えない好《よ》い匂《におい》が、絶間《たえま》なくあたりへ溢《あふ》れて居ります。極楽は丁度朝なのでございましょう。
やがて御釈迦様はその池のふちに御佇《おたたず》みになって、水の面《おもて》を蔽《おお》っている蓮の葉の間から、ふと下の容子《ようす》を御覧になりました。この極楽の蓮池の下は、丁度地獄《じごく》の底に当って居りますから、水晶《すいしよう》のような水を透き徹して、三途《さんず》の河や針の山の景色が、丁度覗《のぞ》き眼鏡《めがね》を見るように、はっきりと見えるのでございます。
するとその地獄の底に、犍陀多《かんだた》と云う男が一人、ほかの罪人と一しょに蠢《うごめ》いている姿が、御眼に止まりました。この犍陀多と云う男は、人を殺したり家に火をつけたり、いろいろ悪事を働いた大泥坊でございますが、それでもたった一つ、善い事を致した覚えがございます。と申しますのは、ある時この男が深い林の中を通りますと、小さな蜘蛛《くも》が一匹、路ばたを這《は》って行くのが見えました。そこで犍陀多は早速足を挙げて、踏み殺そうと致しましたが、「いや、いや、これも小さいながら、命のあるものに違いない。その命を無暗《むやみ》にとると云う事は、いくら何でも可哀そうだ。」と、こう急に思い返して、とうとうその蜘蛛を殺さずに助けてやったからでございます。
御釈迦様は地獄の容子を御覧になりながら、この犍陀多には蜘蛛を助けた事があるのを御思い出しになりました。そうしてそれだけの善い事をした報《むくい》には、出来るなら、この男を地獄から救い出してやろうと御考えになりました。幸い、側を見ますと、翡翠《ひすい》のような色をした蓮の葉の上に、極楽の蜘蛛が一匹、美しい銀色の糸をかけて居ります。御釈迦様はその蜘蛛の糸をそっと御手に御取りになって、玉のような白蓮《しらはす》の間から、遥か下にある地獄の底へ、まっすぐにそれを御下《おろ》しなさいました。
二
こちらは地獄の底の血の池で、ほかの罪人と一しょに、浮いたり沈んだりしていた犍陀多《かんだた》でございます。何しろどちらを見ても、まっ暗で、たまにそのくら暗からぼんやり浮き上っているものがあると思いますと、それは恐しい針の山の針が光るのでございますから、その心細さと云ったらございません。その上あたりは墓の中のようにしんと静まり返って、たまに聞えるものと云っては、ただ罪人がつく微《かすか》な嘆息《たんそく》ばかりでございます。これはここへ落ちて来るほどの人間は、もうさまざまな地獄の責苦《せめく》に疲れはてて、泣声を出す力さえなくなっているのでございましょう。ですからさすが大泥坊の犍陀多も、やはり血の池の血に咽《むせ》びながら、まるで死にかかった蛙《かわず》のように、ただもがいてばかり居りました。
ところがある時の事でございます。何気《なにげ》なく犍陀多が頭を挙げて、血の池の空を眺めますと、そのひっそりとした暗の中を、遠い遠い天上から、銀色の蜘蛛《くも》の糸が、まるで人目にかかるのを恐れるように、一すじ細く光りながら、するすると自分の上へ垂れて参るのではございませんか。犍陀多はこれを見ると、思わず手を拍《う》って喜びました。この糸に縋《すが》りついて、どこまでものぼって行けば、きっと地獄からぬけ出せるのに相違ございません。いや、うまく行くと、極楽へはいる事さえも出来ましょう。そうすれば、もう針の山へ追い上げられる事もなくなれば、血の池に沈められる事もある筈はございません。
こう思いましたから犍陀多《かんだた》は、早速その蜘蛛の糸を両手でしっかりとつかみながら、一生懸命に上へ上へとたぐりのぼり始めました。元より大泥坊の事でございますから、こう云う事には昔から、慣れ切っているのでございます。
しかし地獄と極楽との間は、何万里となくございますから、いくら焦《あせ》って見た所で、容易に上へは出られません。ややしばらくのぼる中《うち》に、とうとう犍陀多もくたびれて、もう一たぐりも上の方へはのぼれなくなってしまいました。そこで仕方がございませんから、まず一休み休むつもりで、糸の中途にぶら下りながら、遥かに目の下を見下しました。

そこで犍陀多は大きな声を出して、「こら、罪人ども。この蜘蛛の糸は己《おれ》のものだぞ。お前たちは一体誰に尋《き》いて、のぼって来た。下りろ。下りろ。」と喚《わめ》きました。
その途端でございます。今まで何ともなかった蜘蛛の糸が、急に犍陀多のぶら下っている所から、ぷつりと音を立てて断《き》れました。ですから犍陀多もたまりません。あっと云う間《ま》もなく風を切って、独楽《こま》のようにくるくるまわりながら、見る見る中に暗の底へ、まっさかさまに落ちてしまいました。

/* ============ 文字種 ============ */
const RE_K = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF々〆〇ヶ仝\u{20000}-\u{3134F}]/u;
const RE_H = /[\u3041-\u3096ゝゞ]/;
const RE_T = /[\u30A1-\u30FAヽヾ\u31F0-\u31FF\uFF66-\uFF9D]/;
const RE_A = /[A-Za-z0-9\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A]/;
const END_S = "。！？!?．";
const END_C = "、，,";
const CLOSE = "」』）)】〕〉》”’］]｝}";
const OPEN  = "「『（(【〔〈《“‘［[｛{";
const DASH  = "…‥―─〜～・：:；;";
function kind(ch){
  if (RE_K.test(ch)) return "K";
  if (RE_H.test(ch)) return "H";
  if (ch==="ー") return "L";
  if (RE_T.test(ch)) return "T";
  if (RE_A.test(ch)) return "A";
  if (END_S.includes(ch)) return "S";
  if (END_C.includes(ch)) return "C";
  if (CLOSE.includes(ch)) return "Q";
  if (OPEN.includes(ch)) return "O";
  if (DASH.includes(ch)) return "D";
  if (/\s/.test(ch)) return "W";
  return "X";
}
const isKanjiCh = ch => RE_K.test(ch) || ch==="※";

/* ============ 青空文庫テキストの整形 ============ */
function decodeGaiji(s){
  return s.replace(/※［＃[^］]*?U\+([0-9A-Fa-f]{4,6})[^］]*］/g,(m,h)=>String.fromCodePoint(parseInt(h,16)))
          .replace(/※［＃[^］]*］/g,"〓");
}
const NUMERAL = /^[一二三四五六七八九十百〇零壱弐参0-9０-９IVXⅠ-Ⅻ*＊※◇◆・\s　.．]+$/;
function parseDoc(raw, opt){
  raw = raw.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  let lines = raw.split("\n");
  let title="", author="";
  // 青空文庫ヘッダー（記号説明ブロック）
  const dashIdx = [];
  for (let i=0;i<Math.min(lines.length,80);i++) if (/^-{20,}\s*$/.test(lines[i])) dashIdx.push(i);
  if (dashIdx.length>=2){
    const meta = lines.slice(0,dashIdx[0]).map(l=>l.trim()).filter(Boolean);
    title = meta[0]||""; author = meta[meta.length>2?meta.length-1:1]||"";
    if (meta.length>2 && !/[作著訳]$/.test(author)) author = meta[1];
    lines = lines.slice(dashIdx[1]+1);
  }
  // フッター
  const foot = lines.findIndex(l=>/^底本[：:]/.test(l.trim()));
  if (foot>=0) lines = lines.slice(0,foot);

  const chapters = [];
  let cur = null;
  const newCh = t => { cur = {title:t, paras:[]}; chapters.push(cur); };
  for (let line of lines){
    const page = line.trim().match(/^［＃RSVPページ:([a-z0-9-]+)］$/);
    if (page){
      if (opt.pdfPages && opt.pdfPages[page[1]]){
        if (!cur) newCh("");
        if (cur.paras[cur.paras.length-1]?.page!==page[1]) cur.paras.push({atoms:[],heading:false,page:page[1]});
      }
      continue;
    }
    const image = line.trim().match(/^［＃RSVP画像:([a-z0-9-]+)］$/);
    if (image){
      if (opt.images && opt.images[image[1]]){
        if (!cur) newCh("");
        cur.paras.push({atoms:[],heading:false,image:image[1]});
      }
      continue;
    }
    line = line.replace(/／″＼/g,"〴〵").replace(/／＼/g,"〳〵");
    line = decodeGaiji(line);
    let head = null, level = "", force = false;
    let m = line.match(/［＃「([^」]+)」は(大|中|小)見出し］/);
    if (m){ head = m[1]; level = m[2]; }
    m = line.match(/［＃(?:窓)?(大|中|小)見出し］(.*?)［＃(?:窓)?(?:大|中|小)見出し終わり］/);
    if (m){ head = m[2]; level = m[1]; }
    line = line.replace(/［＃[^］]*］/g,"").replace(/^[\s　]+|[\s　]+$/g,"");
    if (!line) continue;
    if (!head){
      m = line.match(/^(#{1,3})\s+(.+)$/);
      if (m){ head = m[2].trim(); level = m[1].length===1?"大":"中"; force = m[1].length===1; line = head; }
      else if (line.length<=40 && /^第[0-9０-９一二三四五六七八九十百千〇]+[章話部回節幕編]/.test(line)){ head=line; level="大"; }
    }
    if (!head && line.length<=4 && NUMERAL.test(line)){ head = line; level = "小"; }
    if (head && line.includes(head)) line = head;
    if (head && (force || (level!=="小" && !NUMERAL.test(head)))){
      if (force || !title || chapters.length || head!==title) { newCh(head); continue; }
      else continue; // タイトル行の重複
    }
    if (!cur) newCh("");
    if (opt.paren) line = line.replace(/((?:[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF々〆ヶ]|[\uD840-\uD87F][\uDC00-\uDFFF])+)[（(]([\u3041-\u3096ー]{1,12})[）)]/g,"｜$1《$2》");
    cur.paras.push({atoms: parseRuby(line), heading: !!head});
  }
  const docTitle = opt.title || title || "無題";
  chapters.forEach((c,i)=>{ if(!c.title) c.title = chapters.length===1 ? docTitle : (i===0?"序":"第"+(i+1)+"章"); });
  return {chapters: chapters.filter(c=>c.paras.length), title: title, author: author};
}
function parseRuby(s){
  const cps = Array.from(s), out = [];
  for (let i=0;i<cps.length;i++){
    const c = cps[i];
    if (c==="｜"||c==="|"){
      const lt = cps.indexOf("《",i+1), gt = lt>=0 ? cps.indexOf("》",lt) : -1;
      if (lt>i+1 && gt>lt){ out.push(atom(cps.slice(i+1,lt).join(""), cps.slice(lt+1,gt).join(""))); i = gt; continue; }
      continue;
    }
    if (c==="《"){
      const gt = cps.indexOf("》",i);
      if (gt>i){
        let j = out.length, base = "";
        while (j>0 && !out[j-1].r && isKanjiCh(out[j-1].t)) { j--; base = out[j].t + base; }
        const r = cps.slice(i+1,gt).join("");
        if (base){ out.splice(j); out.push(atom(base,r)); }
        i = gt; continue;
      }
    }
    out.push(atom(c,null));
  }
  // 長音符「ー」は直前の文字種を引き継ぐ（カタカナ語・ひらがな語の途中で切らない）
  for (let i=0;i<out.length;i++) if (out[i].k==="L"){
    const pk = i>0 ? out[i-1].k : "";
    out[i].k = (pk==="H"||pk==="T"||pk==="A") ? pk : "T";
  }
  return out;
}
function atom(t,r){ return {t, r, k: r ? "K" : kind(t), len: Array.from(t).length, n:-1, o:-1}; }

/* ============ 人物 ============ */
function parseChars(txt){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.split(/[\s　,，=＝:：]+/);
    return {name:m[0], label:m.slice(1).join(" ")};
  }).filter(c=>c.name);
}
function markNames(atoms, chars, occSeed){
  if (!chars.length) return occSeed;
  let plain = "", map = [];
  atoms.forEach((a,ai)=>{ for (let k=0;k<a.t.length;k++) map.push(ai); plain += a.t; });
  const order = chars.map((c,i)=>i).sort((a,b)=>chars[b].name.length-chars[a].name.length);
  for (const ni of order){
    const nm = chars[ni].name; let p = plain.indexOf(nm);
    while (p>=0){
      const a0 = map[p], a1 = map[p+nm.length-1];
      let free = true; for (let x=a0;x<=a1;x++) if (atoms[x].n>=0){ free=false; break; }
      if (free){ const o = occSeed++; for (let x=a0;x<=a1;x++){ atoms[x].n = ni; atoms[x].o = o; } }
      p = plain.indexOf(nm, p+nm.length);
    }
  }
  return occSeed;
}

/* ============ 文節分割 ============ */
const PART = new Set(["は","を","に","が","で","と","も","の","へ","て","ば","や","か","ね","よ"]);
const STARTERS = ["その","この","あの","どの","そう","こう","ああ","どう","まるで","やがて","すると","しかし","ところが","ただ","もう","まだ","とうとう","いくら","どこ","ふと","ぶらぶら","するする","せっせと","うようよ","くるくる","きらきら","ゆらゆら","ふわふわ","しっかり","はっきり","ぼんやり","じっと","そっと","まっすぐ","まっさかさま","たった","いろいろ","みんな","まず","さっき","たまに","また","いや","きっと","うまく","あっと","ひっそり","しんと","ぷつり","すぐ","よく","もし","どうか","いつ","なぜ","とても","ずっと","ちょっと","やはり","やっぱり","けれども","だから","それ","これ","あれ","どれ","そこ","ここ","あそこ","なんと","たとえ","せめて","ついに","やっと","すっかり","ちゃんと","きちんと","ほかの","まっ"];
const AUX_TE = ["いる","いた","いら","いま","いな","いて","いれ","おり","おる","おい","しま","くる","くれ","くだ","みる","みた","みて","あっ","ある","あり","いく","いっ","もら","あげ","やっ","やる"];
const isEndPunct = a => a.k==="S"||a.k==="C";
const endsP = seg => { const a = seg.atoms[seg.atoms.length-1]; return isEndPunct(a)||a.k==="Q"; };
const endType = seg => { for (let i=seg.atoms.length-1;i>=0;i--){ const k=seg.atoms[i].k; if(k==="S")return "s"; if(k==="C")return "c"; if(k!=="Q"&&k!=="D")return ""; } return ""; };
const content = seg => seg.atoms.some(a=>a.k==="K"||a.k==="T"||a.k==="A");
function hTail(atoms){ let s=""; for (let i=atoms.length-1;i>=0 && (atoms[i].k==="H"||atoms[i].k==="L");i--) s = atoms[i].t + s; return s; }
function hAhead(atoms,i){ let s=""; for (;i<atoms.length && s.length<8 && (atoms[i].k==="H"||atoms[i].k==="L");i++) s += atoms[i].t; return s; }

function bunsetsu(atoms){
  const segs = []; if (!atoms.length) return segs;
  let cur = {atoms:[atoms[0]], dep:false};
  for (let i=1;i<atoms.length;i++){
    const a = atoms[i], p = atoms[i-1];
    let brk = false, dep = false;
    if (a.o>=0 && a.o===p.o) brk = false;
    else if (isEndPunct(p)) brk = !(isEndPunct(a)||a.k==="Q"||a.k==="D");
    else if (p.k==="Q") brk = !(isEndPunct(a)||a.k==="Q"||a.k==="D"||(a.k==="H"&&/^[とっ]$/.test(a.t)));
    else if (a.k==="O") brk = p.k!=="O";
    else if (a.k==="W"||p.k==="W") brk = a.k!=="W";
    else if (a.o>=0) brk = p.k!=="O";
    else if ((a.k==="K"||a.k==="T"||a.k==="A") && (p.k==="H"||p.k==="L")){
      const t = hTail(cur.atoms);
      brk = !(/(まっ|まん)$/.test(t) || (t.length===cur.atoms.length && /^(お|ご|ひと|ふた)$/.test(t)));
    }
    else if (a.k==="H" && p.k==="H"){
      const ahead = hAhead(atoms,i), tail = hTail(cur.atoms);
      if (PART.has(p.t) && (content(cur)||tail.length>=3) && STARTERS.some(s=>ahead.startsWith(s))) brk = true;
      else if ((p.t==="て"||p.t==="で") && content(cur) && AUX_TE.some(s=>ahead.startsWith(s))) { brk = true; dep = true; }
      else if (p.t==="に" && content(cur) && ahead.startsWith("な")) { brk = true; dep = true; }
    }
    if (brk){ segs.push(cur); cur = {atoms:[a], dep}; } else cur.atoms.push(a);
  }
  segs.push(cur);
  segs.forEach(s=>s.len = s.atoms.reduce((n,a)=>n+(a.k==="W"?0:a.len),0));
  return segs;
}
function mergeShort(segs, min){
  if (min<=1) return segs;
  const out = [];
  for (let i=0;i<segs.length;i++){
    const s = segs[i];
    if (s.len<min){
      const last = out[out.length-1];
      const back = last && !endsP(last) && (s.dep || endsP(s) || i===segs.length-1) && last.len+s.len<=14;
      if (back){ last.atoms = last.atoms.concat(s.atoms); last.len += s.len; continue; }
      if (!endsP(s) && i+1<segs.length){ const nx = segs[i+1]; segs[i+1] = {atoms:s.atoms.concat(nx.atoms), len:s.len+nx.len, dep:s.dep}; continue; }
    }

}

/* ============ チャンク生成 ============ */
let DOC = null;     // {title, author, chars:[{name,label}], chapters:[{title, paras}]}
const CH_CACHE = new Map();
function buildChunks(ci){
  const key = ci+"|"+S.group+"|"+S.min;
  if (CH_CACHE.has(key)) return CH_CACHE.get(key);
  const ch = DOC.chapters[ci], chunks = [], seen = {};
  let off = 0;
  ch.paras.forEach((para, pi)=>{
    let groups;
    if (para.heading) groups = [{atoms:para.atoms, len:para.atoms.reduce((n,a)=>n+a.len,0)}];
    else {
      const segs = mergeShort(bunsetsu(para.atoms), S.min);
      groups = []; let g = null, cnt = 0;
      const N = S.group;
      for (const s of segs){
        if (!g){ g = {atoms:[], len:0}; cnt = 0; }
        g.atoms = g.atoms.concat(s.atoms); g.len += s.len; cnt++;
        const stop = endsP(s) || (N>0 ? cnt>=N : g.len>=18);
        if (stop){ groups.push(g); g = null; }
      }
      if (g) groups.push(g);
    }
    groups.forEach((g, gi)=>{
      const c = {atoms:g.atoms, len:g.len, start:off, para:pi, end:endType(g), paraEnd: gi===groups.length-1, heading:para.heading, lab:{}, hasName:false, ruby:0};
      const done = new Set();
      for (const a of g.atoms){
        if (a.r) c.ruby++;
        if (a.o>=0 && !done.has(a.o)){ done.add(a.o); c.hasName = true; seen[a.n] = (seen[a.n]||0); c.lab[a.o] = seen[a.n]++; }
      }
      off += g.len; chunks.push(c);
    });
  });
  const res = {chunks, total: off};
  CH_CACHE.set(key, res);
  return res;
}

function chunkUnits(c){
  let u = Math.max(c.len, 2) + 0.6;

    if (c.end==="c") u += 2.5;

    if (c.heading) u += 10;

}
function labelShown(c){ return S.label>0 && Object.values(c.lab).some(v=>v<S.label); }
const msPerChar = () => 60000/S.cpm;

/* PDF変換EPUBは元のHTML・CSS・フォントを隔離したページで表示する。 */
let readerTargetRect = null, pdfObserver = null, pdfAssetDoc = null, pdfURLs = {}, pdfPageInfos = [], pdfChunkTexts = [];

          lines.push({id:line.id,text:line.text,textStart:off,textEnd:off+line.text.length}); cursor = off+line.text.length;
        }
      }
      const el = document.createElement("section"); el.className = "pdfPage"; el.dataset.media = id;
      el.innerHTML = `<div class="pdfPageLabel">ページ ${page.number}</div><iframe sandbox="allow-same-origin" title="ページ ${page.number}" scrolling="no"></iframe>`;
      const info = {id,el,lines,start,end,idx:idx<0?Math.max(0,chunks.length-1):idx,scale:1};
      pdfPageInfos.push(info); body.append(el);
    }
    pdfObserver = new IntersectionObserver(entries=>{
      for (const entry of entries) if (entry.isIntersecting){ const info = pdfPageInfos.find(x=>x.el===entry.target); if (info) loadPdfFrame(info); }
    },{root:$("readerScroll"),rootMargin:"700px"});
    pdfPageInfos.forEach(info=>pdfObserver.observe(info.el));
  }
  const available = Math.max(180,$("readerScroll").clientWidth-48), width = Math.min(840,available)*S.readerSize/20;
  body.style.width = width+"px"; body.style.fontSize = "20px";
  for (const info of pdfPageInfos){
    const page = DOC.pdfPages[info.id]; info.scale = width/page.width;
    info.el.style.width = width+"px"; info.el.style.height = page.height*info.scale+"px";
    const sheet = info.el.querySelector("iframe").contentDocument?.getElementById("sbo-rt-content");
    if (sheet) sheet.style.transform = `scale(${info.scale})`;
  }
  $("readerNext").disabled = ST.ch>=DOC.chapters.length-1;
  alignReaderPosition();
}
function markPdfPosition(){
  readerTargetRect = null;
  const off = cur().chunks[ST.idx]?.start ?? cur().total;
  const text = pdfChunkTexts[ST.idx];
  const media = ST.media?.idx===ST.idx ? ST.media : null;
  const info = (media && pdfPageInfos.find(x=>x.id===media.id)) || pdfPageInfos.find(x=>off>=x.start && off<x.end) || pdfPageInfos[pdfPageInfos.length-1];
  for (const x of pdfPageInfos){
    x.el.classList.remove("cur");
    x.el.querySelector("iframe").contentDocument?.querySelectorAll(".reader-highlight").forEach(el=>el.remove());
  }
  if (!info) return null;
  info.el.classList.add("cur"); loadPdfFrame(info);
  const frame = info.el.querySelector("iframe"), d = frame.contentDocument;
  if (text && d){
    for (const line of info.lines){
      const from = Math.max(text.start,line.textStart)-line.textStart, to = Math.min(text.end,line.textEnd)-line.textStart;
      if (from>=to) continue;
      const el = d.querySelector(`[data-reader-line="${line.id}"]`); if (!el) continue;
      const range = pdfLineRange(el,line,from,to); if (!range) continue;
      for (const r of range.getClientRects()){
        if (!r.width || !r.height) continue;
        const mark = d.createElement("div"); mark.className = "reader-highlight";
        mark.style.cssText = `position:absolute;pointer-events:none;z-index:2147483647;background:rgba(241,226,162,.5);left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
        d.body.append(mark);
        if (!readerTargetRect){ const R = frame.getBoundingClientRect(); readerTargetRect = {top:R.top+r.top,bottom:R.top+r.bottom}; }
      }
    }
  }
  return info.el;
}
function updatePdfPosition(){
  const R = $("readerScroll").getBoundingClientRect(), y = R.top+$("readerScroll").clientHeight*.25;
  const info = pdfPageInfos.find(x=>x.el.getBoundingClientRect().bottom>y && x.el.getBoundingClientRect().top<R.bottom);
  if (!info) return;
  // 読み込み中のページでは行の座標が未確定なので、現在位置を保つ。
  // フォントの読み込み完了後に、現在のスクロール位置から再判定する。
  if (!info.el.classList.contains("loaded")){ loadPdfFrame(info); return; }
  const frame = info.el.querySelector("iframe"), d = frame.contentDocument, top = frame.getBoundingClientRect().top;
  // ページ下部の余白では最後の行を選び、ページ先頭へ戻さない。
  const line = info.lines.find(x=>{ const el = d?.querySelector(`[data-reader-line="${x.id}"]`); return el && el.getBoundingClientRect().bottom+top>y; }) || info.lines[info.lines.length-1];
  const i = line ? pdfIdxAtText(line.textStart) : info.idx;
  if (ST.idx!==i || ST.media?.id!==info.id || ST.media?.line!==(line?.id||null)){
    ST.idx = i; ST.media = {id:info.id,line:line?.id||null,idx:i}; markReaderPosition(); renderMeta(); savePos();
  }
}

/* ============ 再生制御 ============ */
let wakeLock = null;
async function lockScreen(on){
  try{
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
function setPlaying(on){
  ST.playing = on;
  $("app").classList.toggle("paused", !on);
  $("pIco").textContent = on ? "❚❚" : "▶"; $("pTxt").textContent = on ? "停止" : "再生";
  $("hint").style.display = on || ST.idx>0 ? "none" : "block";
  lockScreen(on);
  requestAnimationFrame(()=>renderWord());
}
function play(){
  if (S.mode==="normal") return;
  if (ST.finished) { hideDone(); }
  const {chunks} = cur();
  if (ST.idx>=chunks.length) ST.idx = 0;
  setPlaying(true); ST.ramp = 3; step();
}
function step(){
  const {chunks} = cur(); const c = chunks[ST.idx];
  if (!c) return finishChapter();
  renderWord(); renderMeta();
  const ramp = ST.ramp>0 ? [1.1,1.3,1.6][ST.ramp-1] : 1; if (ST.ramp>0) ST.ramp--;
  const d = chunkMs(c)*ramp;
  ST.shownAt = performance.now();
  ST.timer = setTimeout(()=>{
    ST.sess.ms += performance.now()-ST.shownAt; ST.sess.chars += c.len;
    ST.idx++;
    if (ST.idx % 40 === 0) savePos();
    if (ST.idx>=chunks.length) finishChapter(); else step();
  }, d);
}
function pause(){
  if (!ST.playing) return;
  clearTimeout(ST.timer);
  ST.sess.ms += performance.now()-ST.shownAt;
  setPlaying(false); savePos(); renderPreview(true);
}
function toggle(){ ST.playing ? pause() : play(); }
function seek(i){
  const {chunks} = cur();
  const was = ST.playing; if (was){ clearTimeout(ST.timer); ST.sess.ms += performance.now()-ST.shownAt; }
  ST.idx = Math.max(0, Math.min(chunks.length-1, i));
  ST.media = null;
  if (ST.finished) hideDone();
  if (was){ ST.ramp = 1; step(); } else { renderAll(); savePos(); }
  $("hint").style.display = "none";
}
function seekPara(dir){
  const {chunks} = cur(); const c = chunks[ST.idx]; if (!c) return;
  let target = c.para + dir;
  if (dir<0 && chunks[ST.idx-1] && chunks[ST.idx-1].para===c.para) target = c.para; // 段落の頭へ
  if (dir<0){ while (target>=0 && !chunks.some(x=>x.para===target)) target--; }
  const i = chunks.findIndex(x=>x.para>=target);
  seek(i<0 ? (dir<0?0:chunks.length-1) : i);
}
function gotoChapter(ci, idx=0){
  if (ST.playing) pause();
  hideDone();
  ST.ch = Math.max(0, Math.min(DOC.chapters.length-1, ci)); ST.idx = idx; ST.sess = {ms:0,chars:0};

/* ============ 読了・休憩 ============ */
function finishChapter(){
  clearTimeout(ST.timer); setPlaying(false); ST.finished = true;
  const ch = DOC.chapters[ST.ch], {total} = cur();
  const rec = {ch:ST.ch, title:ch.title, chars:ST.sess.chars, ms:ST.sess.ms, cpm:S.cpm};
  const hist = LS.get("hist:"+docKey(), {}); hist[ST.ch] = rec; LS.set("hist:"+docKey(), hist);
  ST.sess = {ms:0,chars:0};
  const eff = rec.ms>0 ? Math.round(rec.chars/(rec.ms/60000)) : 0;
  const rows = Object.values(hist).sort((a,b)=>a.ch-b.ch);
  let tc = 0, tm = 0;
  const tr = rows.map(r=>{ tc+=r.chars; tm+=r.ms; return `<tr><td>${circ(r.ch)} ${esc(r.title)}</td><td>${num(r.chars)}字</td><td>${fmt(r.ms)}</td><td>${r.ms?Math.round(r.chars/(r.ms/60000)):0}字/分</td></tr>`; }).join("");
  const last = ST.ch>=DOC.chapters.length-1;
  $("doneIn").innerHTML = `
    <h2>${circ(ST.ch)} ${esc(ch.title)} 読了</h2>
    <div class="stat">${num(rec.chars)}字 / ${fmt(rec.ms)} ・ 実効 ${eff}字/分（設定 ${S.cpm}字/分）</div>
    <div class="rest">休憩</div><div id="restT">0:00</div>
    <div class="btns">
      ${last ? "" : `<button class="btn pri" id="dNext">次へ：${circ(ST.ch+1)} ${esc(DOC.chapters[ST.ch+1].title)}</button>`}
      <button class="btn" id="dAgain">この章をもう一度</button>
    </div>
    <table>${tr}<tr class="tot"><td>合計</td><td>${num(tc)}字</td><td>${fmt(tm)}</td><td>${tm?Math.round(tc/(tm/60000)):0}字/分</td></tr></table>
    ${last ? `<div class="fin">最後まで読み終わりました。おつかれさまでした</div>` : `<div class="fin">Space で次の章へ</div>`}`;
  $("done").classList.add("on"); $("app").classList.add("fin");
  ST.rest = performance.now();
  clearInterval(ST.restT);
  ST.restT = setInterval(()=>{ const e = $("restT"); if (e) e.textContent = fmt(performance.now()-ST.rest); }, 500);
  if (!last) $("dNext").onclick = ()=>{ gotoChapter(ST.ch+1); play(); };
  $("dAgain").onclick = ()=>{ gotoChapter(ST.ch); };
  ST.idx = cur().chunks.length; renderWord(); renderMeta();
  savePos(true);
}

function loadDoc(src, keepPos){
  const parsed = parseDoc(src.text, {paren: src.paren!==false, title: src.title, images:src.images,pdfPages:src.pdfPages});
  if (!parsed.chapters.length) { toast("本文が見つかりませんでした"); return false; }
  if (ST.playing) pause();
  const chars = parseChars(src.chars||"");
  let occ = 0;
  for (const ch of parsed.chapters) for (const p of ch.paras) occ = markNames(p.atoms, chars, occ);
  loadedSource = src;
  DOC = {title: src.title || parsed.title || "無題", author: src.author || parsed.author || "", chars, images:src.images||{}, pdfPages:src.pdfPages,pdfStyles:src.pdfStyles,pdfAssets:src.pdfAssets,chapters: parsed.chapters};
  CH_CACHE.clear();
  ST.ch = 0; ST.idx = 0; ST.media = null; ST.footerExpanded = false; ST.sess = {ms:0,chars:0};
  if (keepPos){
    const p = LS.get(docKey(), null);
    if (p && p.ch < DOC.chapters.length){ ST.ch = p.chNext ? p.ch+1 : p.ch; ST.idx = idxAtOffset(p.off||0); }

async function readFile(f){
  const version = ++fileReadVersion;
  $("inLoad").disabled = true;
  try {
  $("inInfo").textContent = "読み込み中…";
  const buf = await f.arrayBuffer();
  const head = new Uint8Array(buf.slice(0,4));
  const isZip = head[0]===0x50 && head[1]===0x4B;
  let txt, meta = {};
  if (isZip || /\.epub$/i.test(f.name)){

  } else {

  }
  if (version!==fileReadVersion) return;
  pendingImages = meta.images || {};
  pendingPdf = {pdfPages:meta.pdfPages,pdfStyles:meta.pdfStyles,pdfAssets:meta.pdfAssets};
  $("inText").value = txt;
  const p = parseDoc(txt,{paren:$("inParen").checked,images:pendingImages,pdfPages:meta.pdfPages});
  $("inTitle").value = meta.title || p.title || f.name.replace(/\.[^.]+$/,"");
  $("inAuthor").value = meta.author || p.author || "";
  const n = p.chapters.reduce((s,c)=>s+c.paras.reduce((t,pp)=>t+pp.atoms.reduce((u,a)=>u+a.len,0),0),0);
  let note = "";
  if (meta.pdf) note = "（PDF変換EPUB：通常モードは元のページを表示、速読モードは本文を抽出）";
  $("inInfo").textContent = `${num(n)}字・${p.chapters.length}章・${meta.pdfPages?Object.keys(meta.pdfPages).length+"ページ":"画像"+Object.keys(pendingImages).length+"点"}を検出${note}`;
  } finally { if (version===fileReadVersion) $("inLoad").disabled = false; }
}

/* ============ EPUB ============ */
const BLOCK = new Set("p div section article aside header footer nav blockquote li dt dd tr td th pre figure figcaption table ul ol dl h1 h2 h3 h4 h5 h6 hr main body".split(" "));
const SKIP = new Set(["script","style","rt","rp","head","title","svg","math","noscript"]);
function parseMarkup(str, type){
  let d = new DOMParser().parseFromString(str, type||"application/xhtml+xml");
  if (d.getElementsByTagName("parsererror").length) d = new DOMParser().parseFromString(str, "text/html");
  return d;
}
function rubyText(el){
  const rbs = [], rts = []; let base = "";
  for (const n of el.childNodes){
    if (n.nodeType===3){ base += n.data; continue; }
    if (n.nodeType!==1) continue;
    const t = n.localName.toLowerCase();
    if (t==="rt") rts.push(n.textContent.trim());
    else if (t==="rp") continue;
    else if (t==="rb"){ rbs.push(n.textContent); base += n.textContent; }
    else if (t==="rtc") n.querySelectorAll("rt").forEach(r=>rts.push(r.textContent.trim()));
    else base += n.textContent;
  }
  base = base.replace(/\s+/g,"");
  if (rbs.length>1 && rbs.length===rts.length && base===rbs.join("").replace(/\s+/g,""))
    return rbs.map((b,i)=>rts[i] ? "｜"+b.trim()+"《"+rts[i]+"》" : b.trim()).join("");
  const r = rts.join("");
  return r && base ? "｜"+base+"《"+r+"》" : base;
}
function inlineText(el){
  let s = "";
  for (const n of el.childNodes){
    if (n.nodeType===3) s += n.data.replace(/\s+/g," ");
    else if (n.nodeType===1){
      const t = n.localName.toLowerCase();
      if (SKIP.has(t)) continue;
      if (t==="ruby") s += rubyText(n);
      else if (t==="img"){ const a = (n.getAttribute("alt")||"").trim(); if (a && (Array.from(a).length===1 || /gaiji/i.test(n.getAttribute("class")||""))) s += a; }
      else if (t==="br") s += "\n";
      else s += inlineText(n);
    }
  }
  return s;
}
const headLine = (txt)=>{ const plain = txt.replace(/｜/g,"").replace(/《[^》]*》/g,"").replace(/[「」［］＃]/g,""); return `［＃「${plain}」は小見出し］${txt}`; };
function htmlToLines(body, onId){
  const lines = []; let buf = "";
  const flush = ()=>{ for (const l of buf.split("\n")){ const t = l.replace(/^[ \t]+|[ \t]+$/g,""); if (t.replace(/[\s　]/g,"")) lines.push(t); } buf = ""; };
  const walk = el=>{
    for (const n of el.childNodes){
      if (n.nodeType===3){ buf += n.data.replace(/\s+/g," "); continue; }
      if (n.nodeType!==1) continue;
      const id = n.getAttribute("id");
      if (id && onId){ const mk = onId(id); if (mk){ flush(); lines.push(...mk); } }
      const t = n.localName.toLowerCase();
      if (n.hasAttribute("data-reader-image")){ flush(); lines.push(`［＃RSVP画像:${n.getAttribute("data-reader-image")}］`); continue; }
      if (SKIP.has(t)) continue;
      if (t==="ruby"){ buf += rubyText(n); continue; }
      if (t==="br"){ buf += "\n"; continue; }
      if (t==="img"){ const a = (n.getAttribute("alt")||"").trim(); if (a && (Array.from(a).length===1 || /gaiji/i.test(n.getAttribute("class")||""))) buf += a; continue; }
      if (/^h[1-6]$/.test(t)){
        flush(); const txt = inlineText(n).replace(/\s+/g," ").trim();
        if (txt) lines.push(headLine(txt));
        continue;
      }
      if (BLOCK.has(t)){ flush(); walk(n); flush(); } else walk(n);
    }
  };
  walk(body); flush();
  return lines;
}

/* ---- PDF から変換された EPUB（pdf2htmlEX 形式）----
   本文が私用領域（U+E000〜）の文字で書かれ、埋め込みフォントでしか正しく表示されない。

    if (typeof DecompressionStream==="undefined") throw new Error("このブラウザは EPUB の展開に対応していません");

/* ============ イベント ============ */
function bindEvents(){
  $("btnFooter").onclick = ()=>{ ST.footerExpanded = !ST.footerExpanded; updateReaderFooter(); };
  $("sMode").onchange = e=>setReaderMode(e.target.value);
  $("readerBody").onclick = e=>{
    if (window.getSelection()?.toString()) return;
    const el = e.target.closest(".c,figure[data-media]");
    if (el?.dataset.media){ readerUserScroll = false; cancelAnimationFrame(readerFrame); ST.idx = +el.dataset.i; ST.media = {id:el.dataset.media,idx:ST.idx}; markReaderPosition(); renderMeta(); savePos(); }
    else if (el) seek(+el.dataset.i);
  };
  $("readerBody").addEventListener("keydown",e=>{
    if (e.target.matches("figure[data-media]") && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); e.stopPropagation(); e.target.click(); }
  });
  $("readerNext").onclick = ()=>{ if (ST.ch<DOC.chapters.length-1) gotoChapter(ST.ch+1); };
  const scroller = $("readerScroll");
  for (const type of ["wheel","touchmove","pointerdown"]) scroller.addEventListener(type,()=>{ readerUserScroll = true; },{passive:true});
  scroller.addEventListener("scroll",()=>{
    cancelAnimationFrame(readerFrame); readerFrame = requestAnimationFrame(updateReaderPosition);
  });
  $("stage").onclick = toggle;
  $("btnPlay").onclick = toggle;
  $("btnReset").onclick = ()=>seek(0);
  $("chSel").onchange = e=>gotoChapter(+e.target.value);
  $("bar").onclick = e=>{
    const r = $("bar").getBoundingClientRect(); const {chunks,total} = cur();
    seek(idxAtOffset((e.clientX-r.left)/r.width*total));
  };
  $("pvBody").onclick = e=>{ const el = e.target.closest(".c"); if (el) seek(+el.dataset.i); };
  $("btnOpen").onclick = openDialog;
  $("inCancel").onclick = ()=>$("dlg").close();
  const onFileErr = e=>{ $("inInfo").textContent = "読めませんでした：" + (e && e.message || "形式を確認してください"); };
  $("inFile").onchange = e=>{ const f = e.target.files[0]; if (f) readFile(f).catch(onFileErr); };
  window.addEventListener("dragover", e=>{ e.preventDefault(); });
  window.addEventListener("drop", e=>{
    e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return;
    if (!$("dlg").open) openDialog();
    $("inText").value = ""; readFile(f).catch(onFileErr);
  });
  $("inSample").onclick = async ()=>{ fileReadVersion++; LS.set("doc", SAMPLE); loadDoc(SAMPLE, true); $("dlg").close(); await BOOKS.set(SAMPLE).then(()=>LS.set("doc",null)).catch(()=>{}); toast("サンプルを読み込みました"); };
  $("inLoad").onclick = async ()=>{
    const text = $("inText").value;
    if (!text.trim()){ $("inInfo").textContent = "本文を貼り付けるか、ファイルを選んでください"; return; }
    const src = {text, title:$("inTitle").value.trim(), author:$("inAuthor").value.trim(), chars:$("inChars").value, paren:$("inParen").checked, images:pendingImages,...pendingPdf};
    if (loadDoc(src, true)){
      $("dlg").close();
      const {pdfPages,pdfStyles,pdfAssets,...textSource} = src;
      LS.set("doc",{...textSource,images:{}});
      try {
        await BOOKS.set(src); LS.set("doc",null);
        const n = DOC.chapters.reduce((s,_,i)=>s+buildChunks(i).total,0); toast(`${num(n)}字・${DOC.chapters.length}章を読み込みました`);
      } catch(e){
        if (Object.keys(src.images).length || !LS.set("doc",src)) toast("保存できませんでした。本文・画像はこの画面で読めますが、閉じると消えます");
      }
    }
  };
  document.addEventListener("keydown", e=>{
    if ($("dlg").open) return;
    const t = e.target; if (t && (t.tagName==="INPUT"&&t.type!=="range"&&t.type!=="checkbox" || t.tagName==="TEXTAREA" || t.tagName==="SELECT")) return;
    const k = e.key;
    if (S.mode==="normal" && [" ","ArrowUp","ArrowDown","PageUp","PageDown","Home","End"].includes(k)){
      readerUserScroll = true;
      // 本文にフォーカスを移し、ブラウザー標準のページ送りを利用する。
      if (t.tagName!=="BUTTON" && t.tagName!=="INPUT") scroller.focus({preventScroll:true});
      return;
    }
    if (k===" "){ e.preventDefault(); if (ST.finished && ST.ch<DOC.chapters.length-1){ gotoChapter(ST.ch+1); play(); } else toggle(); }
    else if (k==="ArrowRight"){ e.preventDefault(); e.shiftKey ? seekPara(1) : seek(ST.idx+1); }
    else if (k==="ArrowLeft"){ e.preventDefault(); e.shiftKey ? seekPara(-1) : seek(ST.idx-1); }
    else if (k==="ArrowUp"){ e.preventDefault(); bumpSpeed(100); }
    else if (k==="ArrowDown"){ e.preventDefault(); bumpSpeed(-100); }
    else if (k==="v"||k==="V"){ const c=$("sVert"); c.checked=!c.checked; c.onchange(); }
    else if (k==="Escape"){ pause(); }
    else if (k==="Home"){ seek(0); }
  });
  document.addEventListener("keyup", e=>{ if (e.key===" " && e.target && e.target.tagName==="BUTTON") e.preventDefault(); });
  let rz = 0; const relayout = ()=>{ cancelAnimationFrame(rz); rz = requestAnimationFrame(()=>{ renderWord(); placeTicks(); renderReader(); }); };
  if ("ResizeObserver" in window) new ResizeObserver(relayout).observe(stageWrap); else window.addEventListener("resize", relayout);
  document.addEventListener("visibilitychange", ()=>{ if (document.hidden) pause(); else if (ST.playing) lockScreen(true); });
  window.addEventListener("pagehide", ()=>{ updateReaderPosition(); savePos(); });
}

/* ============ 起動 ============ */
bindSettings(); bindEvents();
loadDoc(LS.get("doc", null) || SAMPLE, true);
const startupSource = loadedSource;
if (!LS.get("doc",null)) BOOKS.get().then(src=>{ if (src && loadedSource===startupSource && !$("dlg").open) loadDoc(src,true); }).catch(()=>{});
if (S.mode==="normal") $("keys").textContent = "←→ 1文節 · Shift+←→ 段落";
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ renderWord(); renderReader(); });
</script>
